# The dashboard container.
#
#   docker compose up -d --build          # http://localhost:9000
#
# The backend is expected to be running separately (see https://github.com/muharrem-demir/fin-dashboard). Nothing here
# proxies to it: the browser calls the API directly, so the URLs below are the ones a *browser on the
# host* must be able to reach. That is why they say localhost:8080 and not a compose service name —
# `http://api:8080` resolves inside the compose network, never in the user's browser.
#
# Because those calls are cross-origin, the backend must allow this app's origin
# (http://localhost:9000 by default). See "Cross-origin requests" in README.md.
#
# Values come from .env when present; see .env.example.

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
    container_name: fin-dashboard-ui
    environment:
      SERVER_PORT: 9000
      # Where the browser should send API and WebSocket traffic. These also drive the
      # Content-Security-Policy `connect-src` that the entrypoint renders into the nginx config.
      APP_API_BASE_URL: ${APP_API_BASE_URL:-http://localhost:8080/api/v1}
      APP_WS_URL: ${APP_WS_URL:-ws://localhost:8080/ws/quotes}
      APP_ENVIRONMENT_LABEL: ${APP_ENVIRONMENT_LABEL:-DOCKER}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-warn}
    ports:
      - "${UI_PORT:-9000}:9000"
    restart: unless-stopped
