# The dashboard, plus the API and database it talks to.
#
#   docker compose up -d --build          # everything; open http://localhost:3000
#   docker compose up -d postgres api     # backend only, then `npm run dev` for the UI
#
# The API and database definitions mirror the backend repository's own compose file, so this brings up
# a complete stack from one command rather than requiring two repositories to be started in order.
# Values come from .env when present; see .env.example. The credentials below are development defaults
# for a throwaway local container and must not be used anywhere else.

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: ${BUILD_MODE:-production}
    container_name: fin-dashboard-ui
    environment:
      # Where nginx forwards /api and /ws. A service name, so it resolves on the compose network.
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8080}
      SERVER_PORT: 8080
      # Left unset, the bundle keeps its build-time defaults (/api/v1 and /ws/quotes), which the nginx
      # proxy above already serves. Set APP_API_BASE_URL only to bypass the proxy and call an API
      # directly from the browser — which then needs CORS on that API.
      APP_ENVIRONMENT_LABEL: ${APP_ENVIRONMENT_LABEL:-DOCKER}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-warn}
    ports:
      - "${UI_PORT:-3000}:8080"
    restart: unless-stopped
