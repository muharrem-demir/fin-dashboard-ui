# Local development (`npm run dev`).
#
# The Vite dev server proxies /api and /ws to the Java API, so the relative URLs inherited from
# config.default.yaml already point at http://localhost:8080. Override the proxy target with
# API_PROXY_TARGET / WS_PROXY_TARGET rather than changing the URLs here.

app:
  environmentLabel: DEV

logging:
  level: debug
