# Base configuration shared by every environment.
#
# Environment-specific files (config.<mode>.yaml) are deep-merged on top of this one at build
# time by vite-plugins/app-config-plugin.ts, and a container may override the result again at
# runtime through /config.js (see docker/entrypoint.sh). Nothing here is a secret: every value
# ends up in the browser bundle.

app:
  name: Fin Dashboard
  # Shown in the header so it is obvious which environment a tab is pointed at.
  # An empty label hides the badge entirely.
  environmentLabel: ""

api:
  # The browser calls the API directly — nothing proxies these requests. The URL is therefore
  # absolute and points at wherever the Java backend is actually listening, which for a local
  # checkout is port 8080.
  #
  # Because this is a cross-origin call, the backend MUST send CORS headers that allow this app's
  # origin. See the "Cross-origin requests" section of README.md.
  baseUrl: http://localhost:8080/api/v1
  timeoutMs: 15000

websocket:
  # Absolute too, and for the same reason. `ws://` for a plain-HTTP backend; a TLS deployment needs
  # `wss://`. The backend's own QUOTES_STREAM_ALLOWED_ORIGINS controls who may connect.
  url: ws://localhost:8080/ws/quotes
  reconnect:
    enabled: true
    initialDelayMs: 1000
    maxDelayMs: 15000
    maxAttempts: 8

logging:
  # error | warn | info | debug
  level: info
