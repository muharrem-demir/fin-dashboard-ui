# Production build (`npm run build`).
#
# The URLs inherited from config.default.yaml point at localhost:8080, which is almost certainly wrong
# for a deployment. Because the browser now calls the API directly, every deployment must say where
# that API is — either at build time with APP_API_BASE_URL / APP_WS_URL, or at container start through
# the same variables (docker/entrypoint.sh writes them into /config.js).
#
# Getting this wrong is loud rather than subtle: the app renders and every request fails with a
# network error, which is what the error states are for.

app:
  environmentLabel: ""

logging:
  level: warn
